#user  nobody;
worker_processes  auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1k;

    server {
        listen       80;
        server_name  harness.zhigouread.com;

        root   C:/web/harness;
        index  index.html;

        # Let's Encrypt HTTP-01 挑战
        location ^~ /.well-known/acme-challenge/ {
            try_files $uri =404;
        }

        # 其余请求跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen       443 ssl;
        server_name  harness.zhigouread.com;

        ssl_certificate      C:/nginx/ssl/harness.zhigouread.com-chain.pem;
        ssl_certificate_key  C:/nginx/ssl/harness.zhigouread.com-key.pem;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols        TLSv1.2 TLSv1.3;

        root   C:/web/harness;
        index  index.html;

        # 访问统计看板（独立目录，发布站点时不受影响）
        location /stats/ {
            alias C:/web/stats/;
            index index.html;
        }

        # 通用埋点采集端点：不写后端，信号直接落专用日志
        location = /t/hit {
            access_log C:/nginx/logs/track.log main;
            add_header Access-Control-Allow-Origin *;
            return 204;
        }

        # 埋点脚本托管（任意第三方站点可跨域加载）
        location = /t/tracker.js {
            alias C:/web/track/tracker.js;
            default_type application/javascript;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=3600";
        }

        # VitePress cleanUrls：/guide/paths -> /guide/paths.html
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # 带内容哈希的构建产物长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        error_page  404  /404.html;
    }

    # 裸 IP 访问兜底
    server {
        listen       80 default_server;
        server_name  _;

        root   C:/web/harness;
        index  index.html;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
